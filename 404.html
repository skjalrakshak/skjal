<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | SK Jalrakshak Innovations</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --ink: #0b0a08;
      --paper: #f5f1e8;
      --line: rgba(245, 241, 232, 0.18);
      --amber: #bb8f55;
      --teal: #9ad9d0;
      --sage: #6f8f62;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--paper);
      background:
        linear-gradient(90deg, rgba(245, 241, 232, 0.04) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(0deg, rgba(245, 241, 232, 0.03) 1px, transparent 1px) 0 0 / 72px 72px,
        var(--ink);
    }

    .stage {
      position: absolute;
      inset: 0;
      perspective: 900px;
      opacity: 0.72;
    }

    .block {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(245, 241, 232, 0.16), rgba(245, 241, 232, 0.03));
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.38);
      animation: drift 10s ease-in-out infinite;
    }

    .block:nth-child(1) { left: 8%; top: 18%; transform: rotateX(58deg) rotateZ(18deg); }
    .block:nth-child(2) { right: 12%; top: 12%; width: 220px; height: 110px; animation-delay: -2s; }
    .block:nth-child(3) { left: 16%; bottom: 10%; width: 230px; height: 82px; animation-delay: -4s; }
    .block:nth-child(4) { right: 18%; bottom: 14%; width: 120px; height: 220px; animation-delay: -6s; }

    @keyframes drift {
      0%, 100% { translate: 0 0; rotate: 0deg; }
      50% { translate: 0 -28px; rotate: 4deg; }
    }

    main {
      position: relative;
      z-index: 2;
      width: min(920px, calc(100vw - 2rem));
      padding: 2rem;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(245, 241, 232, 0.13), rgba(245, 241, 232, 0.04));
      backdrop-filter: blur(24px) saturate(1.25);
      -webkit-backdrop-filter: blur(24px) saturate(1.25);
    }

    p {
      margin: 0;
      max-width: 620px;
      color: rgba(245, 241, 232, 0.72);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .eyebrow {
      color: var(--amber);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 1rem;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 8rem;
      line-height: 0.86;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 2rem;
    }

    a {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.1rem;
      color: var(--ink);
      background: linear-gradient(120deg, var(--amber), var(--sage));
      font-weight: 800;
      text-decoration: none;
    }

    a.secondary {
      color: var(--paper);
      border: 1px solid var(--line);
      background: rgba(245, 241, 232, 0.06);
    }

    .beam {
      position: absolute;
      top: -35vh;
      left: 48%;
      width: 26vw;
      height: 120vh;
      transform: rotate(22deg);
      background: linear-gradient(180deg, rgba(187, 143, 85, 0.2), transparent);
      filter: blur(12px);
      pointer-events: none;
    }

    @media (max-width: 720px) {
      h1 { font-size: 4.6rem; }
      main { padding: 1rem; }
      .block { opacity: 0.52; }
    }
  </style>
</head>
<body>
  <div class="beam" aria-hidden="true"></div>
  <div class="stage" aria-hidden="true">
    <i class="block"></i>
    <i class="block"></i>
    <i class="block"></i>
    <i class="block"></i>
  </div>
  <main>
    <div class="eyebrow">404 / Signal lost</div>
    <h1>Block not found.</h1>
    <p>The requested route is not part of the active monitoring network. Return to the live site or jump straight to the contact section.</p>
    <div class="actions">
      <a href="/">Return home</a>
      <a class="secondary" href="/#contact">Contact team</a>
    </div>
  </main>
</body>
</html>
