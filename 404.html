<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      if (sessionStorage.getItem('isPageTransition') === 'true') {
        document.documentElement.classList.add('page-transitioning');
        document.documentElement.style.backgroundColor = '#111823';
        document.documentElement.style.visibility = 'hidden';
      }
    </script>

    <title>Page Not Found Error - 404 Troubleshooting | SKJAL</title>
    <meta name="description" content="The requested page was not found on our server. Browse SKJAL Innovations to explore industrial IoT, smart energy meters, and water quality telemetry today." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Plus Jakarta Sans", "Inter", "Segoe UI", system-ui, sans-serif;
        color: #ffffff;
        background: #0a0a0a;
      }

      .container {
        text-align: center;
        padding: 2rem;
        max-width: 600px;
      }

      .error-code {
        font-family: "Plus Jakarta Sans", "Inter", "Segoe UI", serif;
        font-size: clamp(7rem, 20vw, 12rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #0ea5e9;
        opacity: 0.15;
        margin-bottom: -1.5rem;
        position: relative;
      }

      h1 {
        font-family: "Plus Jakarta Sans", "Inter", "Segoe UI", serif;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.55);
        max-width: 440px;
        margin: 0 auto 2.5rem;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0.75rem 1.5rem;
        font-family: "Plus Jakarta Sans", "Inter", "Segoe UI", sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;
        transition: all 0.25s ease;
      }

      .btn-primary-404 {
        color: #ffffff;
        background: #0ea5e9;
      }
      .btn-primary-404:hover {
        background: #0284c7;
        transform: translateY(-1px);
      }

      .btn-secondary {
        color: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: transparent;
      }
      .btn-secondary:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: #ffffff;
      }

      .divider {
        width: 48px;
        height: 2px;
        background: rgba(14, 165, 233, 0.3);
        margin: 0 auto 1.5rem;
        border-radius: 2px;
      }

      @media (max-width: 480px) {
        .container {
          padding: 1.5rem;
        }
        .actions {
          flex-direction: column;
          align-items: center;
        }
        a {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <div class="divider"></div>
        <p>
          The page you're looking for doesn't exist or has been moved. Head back
          to the homepage or reach out to our team.
        </p>
        <div class="actions">
          <a class="btn-primary-404" href="/">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Return Home
          </a>
          <a class="btn-secondary" href="/contact">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            Contact Team
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
