      }

      .container {
        text-align: center;

      }

      .error-code {

        color: #0ea5e9;
        opacity: 0.15;
        margin-bottom: -1.5rem;

        flex-wrap: wrap;
      }

        align-items: center;
        gap: 8px;

        font-weight: 600;
        text-decoration: none;

        transition: all 0.25s ease;

      .btn-primary {
        color: #ffffff;
        background: #0ea5e9;
      }
      .btn-primary:hover {
        background: #0284c7;

      .btn-secondary {
        color: rgba(255, 255, 255, 0.7);

      }
      .btn-secondary:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: #ffffff;
      }

        width: 48px;

        background: rgba(14, 165, 233, 0.3);

        border-radius: 2px;
      }

      @media (max-width: 480px) {

          padding: 1.5rem;
        }

          flex-direction: column;

        }

          justify-content: center;
        }

    @media (max-width: 640px) {
  .dir-card { flex-direction: column; text-align: center; gap: 16px; }

}
